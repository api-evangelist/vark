name: Vark (Aardvark)
description: Vark is the Felicis portfolio listing for Aardvark, the social search / knowledge-market
  startup founded in 2007 by Max Ventilla, Nathan Stoll, Damon Horowitz, and Rob Spiro (The Mechanical
  Zoo). Users asked questions and were connected live with friends or friends-of-friends who could
  answer them, over email and IM. Google acquired Aardvark on February 11, 2010 for $50 million and
  shut the service down in September 2011. The company is defunct and published no public API. Its
  original domain vark.com no longer resolves, and the vark.io URL listed on the Felicis portfolio
  page now hosts an unrelated SMS meeting-reminder product operated by Saasology LLC.
